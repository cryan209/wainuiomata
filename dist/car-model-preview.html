<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wainui vehicle models</title><style>body{margin:0;background:#ced9dd;font:15px system-ui;color:#182c37}canvas{display:block}aside{position:absolute;top:26px;left:32px}h1{font-size:25px;margin:0 0 8px}p{margin:8px 0}select{padding:10px;font:inherit;min-width:270px;border:1px solid #81969d;background:#f3f6f5;border-radius:4px}footer{position:absolute;bottom:25px;left:32px;color:#3a505a}a{color:inherit}</style><aside><h1>Wainui classics</h1><select aria-label="Vehicle model"></select><p id="spec"></p></aside><footer>Drag to rotate · Scroll to zoom · <a href="/">Return to the valley</a></footer><script type="module">
import * as T from './vendor/three.js';
import{CLASSICS,classicGeometry,createClassicFleet}from'./classic-cars.js?v=cabin-31';
const scene=new T.Scene();scene.background=new T.Color('#ced9dd');scene.fog=new T.Fog('#ced9dd',24,65);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight('#e8f4ff','#7b8170',2));const sun=new T.DirectionalLight('#fff2dc',2.7);sun.position.set(4,9,-5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9});sun.shadow.bias=-.0002;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshLambertMaterial({color:'#abb7b7'}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const carScene=new T.Group();scene.add(carScene);const cars=CLASSICS.map((m,index)=>({index,position:{x:0,y:0,z:0},yaw:0})),fleet=createClassicFleet(carScene,cars);for(const c of cars)fleet.write(c);fleet.finish(.1);carScene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
const select=document.querySelector('select');for(const m of CLASSICS)select.add(new Option(m.name,m.id));let model=CLASSICS[0],azimuth=-.78,elevation=.30,distance=8;
function show(){model=CLASSICS.find(m=>m.id===select.value);for(const o of carScene.children)o.visible=o.name.startsWith(model.name+' / ');distance=Math.max(7,model.length*1.65);document.querySelector('#spec').textContent=`${model.length.toFixed(2)} m long · ${model.width.toFixed(2)} m wide`;frame()}
select.onchange=show;let drag=false,lastX=0,lastY=0;renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-lastX)*.009;elevation=T.MathUtils.clamp(elevation+(e.clientY-lastY)*.005,.06,1.15);lastX=e.clientX;lastY=e.clientY;frame()};renderer.domElement.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance+e.deltaY*.01,3,22);frame()};function frame(){camera.position.set(Math.sin(azimuth)*distance,model.roof*.45+Math.sin(elevation)*distance,-Math.cos(azimuth)*Math.cos(elevation)*distance);camera.lookAt(0,model.roof*.45,0);renderer.render(scene,camera)}onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frame()};show();
</script></html>
